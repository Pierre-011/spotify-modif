name: Update artistes.json

on:
  workflow_dispatch:
    inputs:
      updated_json:
        description: "JSON complet de artistes.json"
        required: true
        type: string
      modified_ids:
        description: "IDs modifiés, séparés par des virgules"
        required: false
        type: string
      timestamp:
        description: "Horodatage"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write artistes.json
        run: |
          cat > artistes.json <<'EOF'
          ${{ inputs.updated_json }}
          EOF

      - name: Detect changes
        run: |
          git diff -- artistes.json || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artistes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MSG="Update artistes.json"
          if [ -n "${{ inputs.modified_ids }}" ]; then
            MSG="$MSG (${inputs.modified_ids})"
          fi
          git commit -m "$MSG"
          git push
